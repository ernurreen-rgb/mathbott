name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    services:
      # The statistics queries are PostgreSQL only, so their tests need a real server.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Each test run creates and drops its own database on this server.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: bot/requirements.txt
      - name: Install backend dependencies and check tools
        working-directory: ./bot
        # httpx is test-only: the tests drive the ASGI app through httpx.ASGITransport.
        run: python -m pip install -r requirements.txt flake8 pip-audit pytest "httpx==0.28.1"
      - name: Check Python syntax
        working-directory: ./bot
        run: python -m compileall -q .
      - name: Run linter (flake8)
        working-directory: ./bot
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run backend tests (pytest)
        working-directory: ./bot
        run: python -m pytest tests
      - name: Check backend dependencies
        working-directory: ./bot
        run: pip-audit --desc -r requirements.txt

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: ./web
        run: npm ci
      - name: Run linter (ESLint)
        working-directory: ./web
        run: npm run lint
      - name: Check TypeScript
        working-directory: ./web
        run: npm run typecheck
      - name: Build frontend
        working-directory: ./web
        run: npm run build
      - name: Check frontend dependencies
        working-directory: ./web
        run: npm audit --audit-level=moderate
