name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      working-directory: ./bot
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio
    
    - name: Run linter (flake8)
      working-directory: ./bot
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run tests
      working-directory: ./bot
      run: |
        pytest tests/ -v --tb=short
    
    - name: Check security (pip-audit)
      working-directory: ./bot
      run: |
        pip install pip-audit
        pip-audit --desc -r requirements.txt

  backend-postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mathbot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mathbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mathbot -d mathbot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MATHBOT_TEST_DATABASE_URL: postgresql://mathbot:ci-only-password@localhost:5432/mathbot_test
      SENTRY_DSN: ""
      ALERTS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: ./bot
        run: pip install -r requirements.txt
      - name: Test repositories and routes against PostgreSQL
        working-directory: ./bot
        run: pytest tests/ -q --tb=short

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    
    - name: Install dependencies
      working-directory: ./web
      run: npm ci
    
    - name: Run linter (ESLint)
      working-directory: ./web
      run: npm run lint
    
    - name: Run tests
      working-directory: ./web
      run: npm test -- --coverage --watchAll=false

    - name: Check TypeScript
      working-directory: ./web
      run: npm run typecheck
    
    - name: Check security (npm audit)
      working-directory: ./web
      run: npm audit --audit-level=moderate

  security-audit:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    
    - name: Backend security audit
      working-directory: ./bot
      run: |
        pip install pip-audit
        pip-audit --desc -r requirements.txt
    
    - name: Frontend security audit
      working-directory: ./web
      run: |
        npm audit --audit-level=high
